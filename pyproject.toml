[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vsummary"
version = "0.3.0"
description = "Discord bot for summarizing videos using NotebookLM"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv",
    "discord.py",
    "beanie",
    "httpx",
]

[dependency-groups]
dev = [
    "notebooklm-py[browser]",
    "ruff>=0.16",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

deploy = [
    "notebooklm-py[headless]",
]

[project.scripts]
vsummary = "vsummary.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
