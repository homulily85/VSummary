[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vsummary"
version = "0.1.1"
description = "Discord bot for summarizing videos using NotebookLM"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv",
    "discord.py",
    "beanie",
    "notebooklm-py",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[project.scripts]
vsummary = "vsummary.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
