[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vsummary"
version = "1.7.0"
description = "Discord bot for summarizing videos using NotebookLM"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.2.4",
    "discord.py>=2.7.1",
    "beanie>=2.2.0",
    "httpx>=0.28.1",
    "notebooklm-py[headless]>=0.8.6",
    "rich>=15.0.0",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
docker = ["yt-dlp-ejs>=0.8.0"]

[dependency-groups]
dev = [
    "notebooklm-py[browser]>=0.8.6",
    "ruff>=0.16",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
vsummary = "vsummary.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
